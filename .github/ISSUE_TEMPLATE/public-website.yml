name: Public website problem
description: Report a reproducible problem with the public research desk or documentation.
title: "[Website] "
body:
  - type: markdown
    attributes:
      value: "Use this form for public website problems. Keep security findings private under SECURITY.md. Never include credentials, wallet secrets or personal data."
  - type: input
    id: page
    attributes:
      label: Page or public case URL
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Include the relevant browser and device. Use public test data only.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Public report boundary
      options:
        - label: This report contains no credentials, personal identifiers or sensitive vulnerability details.
          required: true
