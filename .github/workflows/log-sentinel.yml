# Evidence log sentinel: an outside check of EXIT's public evidence log, run by GitHub, not by EXIT's server.
# Every day at 00:45 UTC (15 minutes after EXIT's daily anchor run) it fetches the verifier from this repository at this commit,
# verifies the published log at https://exit-protocol.io/log/ against Solana, checks that the newest anchor and the newest
# daily run are less than 26 hours old, and writes the result to the `sentinel` branch of this repository
# (results/<date>.json for the day's first scheduled run on its first attempt, results/<date>-<event>-<run id>-<attempt>.json for any
# other run or re-run, and
# latest.json for the newest run). The job fails, visibly, when a log integrity check fails; a public-text drift is a warning
# annotation on a passing run (status DOCS_DRIFT in the result).
# No secrets other than the job's own token; it writes only to the `sentinel` branch; no third-party actions.
name: Evidence log sentinel

on:
  schedule:
    - cron: '45 0 * * *'
  workflow_dispatch: {}

permissions:
  contents: read          # the verifying job reads only; the recording job below holds the write permission

concurrency:
  group: evidence-log-sentinel
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      LOG_URL: https://exit-protocol.io/log/
    steps:
      - name: Verify the published log from outside EXIT's server
        shell: bash
        run: |
          set -uo pipefail
          curl -fsSL --retry 3 "https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/${GITHUB_SHA}/tools/exit_log_verify.py" -o exit_log_verify.py
          # One snapshot of the log documents. The verifier and the freshness checks below read these same bytes; nothing is
          # fetched a second time, so both judgements describe one view of the log (their hashes go into the result).
          mkdir -p snapshot
          for doc in leaves.json roots.json anchors.json notaries.json runs.json; do
            curl -fsSL --retry 3 -H 'User-Agent: exit-log-sentinel/1' "${LOG_URL}${doc}" -o "snapshot/${doc}" || echo "fetch failed: ${doc}" >> snapshot.err
          done
          # Public claims vs the live service (tools/claims_check.py, same commit): API description version, STATUS rows marked LIVE vs the
          # status route's live_* flags, free-period wording, sitemap dates vs page Last-Modified. Its result is folded into result.json below.
          mkdir -p repo
          for f in STATUS.md openapi.json exit_mcp.py tools/claims_check.py; do   # exit_mcp.py: the client row's server version is checked against it (10 Nov)
            mkdir -p "repo/$(dirname "$f")"
            curl -fsSL --retry 3 "https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/${GITHUB_SHA}/${f}" -o "repo/${f}" || echo "fetch failed: ${f}" >> snapshot.err
          done
          python3 -I repo/tools/claims_check.py --repo repo > claims.json 2> claims.err || true
          used=""
          # 2026-11-03 (outside review H1): solana-rpc.publicnode.com keeps only about two days of transactions, so it cannot confirm older
          # anchors. A second public endpoint of the official Solana cluster (same operator, not an independent provider) is tried before it.
          # Every attempt is kept (rpc_attempts in the result), so a day on which all fail shows each provider's own first problem.
          n=0
          for rpc in https://api.mainnet-beta.solana.com https://api.mainnet.solana.com https://solana-rpc.publicnode.com; do
            n=$((n+1))
            python3 -I exit_log_verify.py log ./snapshot/ --rpc "$rpc" > "verify-$n.json" 2> "verify-$n.err"; rc=$?
            printf '%s\t%s\t%s\n' "$n" "$rpc" "$rc" >> rpc_attempts.tsv
            cp "verify-$n.json" verify.json; cp "verify-$n.err" verify.err; used="$rpc"
            if [ "$rc" -eq 0 ]; then break; fi
          done
          RPC_USED="$used" python3 -I - <<'PY'
          import hashlib, json, os, sys, time
          from datetime import datetime, timezone
          base = os.environ['LOG_URL']
          snap = os.environ.get('SNAPSHOT', 'snapshot')
          now = float(os.environ.get('SENTINEL_NOW') or time.time())      # SENTINEL_NOW is set only by this workflow's own tests
          DOCS = ('leaves.json', 'roots.json', 'anchors.json', 'notaries.json', 'runs.json')
          def doc(name):
              with open(os.path.join(snap, name), 'rb') as fh:
                  return json.loads(fh.read())
          def digest(name):
              try:
                  with open(os.path.join(snap, name), 'rb') as fh:
                      return hashlib.sha256(fh.read()).hexdigest()
              except OSError:
                  return None
          out = {'format': 'exit.log-sentinel/3', 'run_at': datetime.fromtimestamp(now, timezone.utc).isoformat(), 'log': base,
                 'verifier_sha256': hashlib.sha256(open('exit_log_verify.py', 'rb').read()).hexdigest(),
                 'commit': os.environ.get('GITHUB_SHA'), 'rpc': os.environ.get('RPC_USED'),
                 'snapshot_sha256': {name: digest(name) for name in DOCS}, 'checks': {}}
          try:
              v = json.load(open('verify.json'))
          except (OSError, ValueError):
              v = {'verified': False, 'problems': ['the verifier gave no JSON result']}
          out['verify'] = v
          out['checks']['log_verified'] = v.get('verified') is True
          attempts = []
          try:
              for line in open('rpc_attempts.tsv').read().splitlines():
                  k, provider, rc = line.split('\t')
                  try:
                      d = json.load(open('verify-%s.json' % k)); first = (d.get('problems') or [d.get('why')])[0]
                  except Exception:
                      first = 'no JSON result'
                  attempts.append({'provider': provider, 'exit': int(rc), 'first_problem': first})
          except OSError:
              pass                                     # no attempt list (the loop did not run)
          except Exception as e:
              attempts.append({'provider': None, 'exit': None, 'first_problem': 'attempt list unreadable: ' + type(e).__name__})
          out['rpc_attempts'] = attempts
          # Freshness is judged on the newest anchor the verifier CONFIRMED on chain (anchors_fetched[].anchor_ok), read from the
          # same snapshot the verifier checked. An anchor the verifier did not confirm, however recent, does not count as fresh.
          # Bounds compare the unrounded age: 26 h covers one daily run plus slack; -0.25 h tolerates 15 minutes of runner-clock vs
          # validator block-time skew, and a block time further in the future is not fresh. Both bounds are policy, stated here.
          try:
              # 2026-11-03 review: a heartbeat re-anchors the same root at the same size, so confirmations are matched by position (the
              # verifier fetches the anchors in document order, one each) and by signature, never by size alone
              listed = doc('anchors.json')['anchors']; fetched = v.get('anchors_fetched', [])
              confirmed = {a['signature'] for a, f in zip(listed, fetched) if f.get('anchor_ok') is True} if len(fetched) == len(listed) else set()
              newest = max((a for a in listed if a['signature'] in confirmed), key=lambda a: a['block_time'])
              age = (now - newest['block_time']) / 3600
              out['newest_anchor'] = {'size': newest['size'], 'signature': newest['signature'], 'block_time_utc': newest.get('block_time_utc'),
                                      'age_hours': round(age, 2), 'confirmed_on_chain': True}
              out['checks']['anchor_within_26h'] = -0.25 <= age <= 26
          except Exception as e:
              out['newest_anchor'] = {'error': type(e).__name__, 'confirmed_on_chain': False}
              out['checks']['anchor_within_26h'] = False
          try:
              last = doc('runs.json')['runs'][-1]
              age = (now - datetime.fromisoformat(last['at']).timestamp()) / 3600
              out['newest_run'] = {'at': last['at'], 'outcome': last['outcome'], 'age_hours': round(age, 2)}
              out['checks']['run_within_26h'] = -0.25 <= age <= 26
              out['checks']['run_outcome_ok'] = last.get('outcome') in ('ANCHORED', 'HEARTBEAT_ANCHORED', 'NO_NEW_RECORDS', 'PENDING_RECORDED', 'NOT_FINALIZED')   # HEARTBEAT_ANCHORED: SPEC 1.5 daily heartbeat (31 Oct, 1 Nov)   # the daily run's documented OK outcomes; unknown, missing and failed outcomes are not OK
          except Exception as e:
              out['newest_run'] = {'error': type(e).__name__}
              out['checks']['run_within_26h'] = False
              out['checks']['run_outcome_ok'] = False
          try:
              c = json.load(open('claims.json'))
              out['claims'] = {'checks': c.get('checks'), 'mismatches': c.get('mismatches'), 'api_description': c.get('api_description'), 'client_row': c.get('client_row')}
              out['checks']['public_claims_match_live'] = c.get('ok') is True
          except (OSError, ValueError):
              out['claims'] = {'error': 'claims_check gave no JSON result'}
              out['checks']['public_claims_match_live'] = False
          out['ok'] = all(out['checks'].values())
          # 2026-11-03 (outside review H2): the log's own checks and the public-claims check are reported apart. FAILED = a log check failed;
          # DOCS_DRIFT = the log verified and is fresh, but a public text no longer matches the live service; OK = everything holds.
          out['log_ok'] = all(v for k, v in out['checks'].items() if k != 'public_claims_match_live')
          out['status'] = 'OK' if out['ok'] else ('DOCS_DRIFT' if out['log_ok'] else 'FAILED')
          json.dump(out, open('result.json', 'w'), indent=1, sort_keys=True)
          print(json.dumps(out, indent=1, sort_keys=True))
          # v4 (2026-11-03, outside review MG-20261103 P4): only an integrity failure fails the job; a public text that drifted from the live
          # service is a visible annotation on a green run (DOCS_DRIFT), recorded in the result like every other status.
          if out['status'] == 'DOCS_DRIFT':
              print('::warning title=DOCS_DRIFT::the log verified and is fresh; a public text no longer matches the live service (public_claims_match_live false)')
          sys.exit(0 if out['log_ok'] else 1)
          PY

      - name: Hand the result to the recording job (job output, no third-party action)
        if: always()
        id: result
        shell: bash
        run: |
          set -euo pipefail
          test -f result.json || exit 0
          echo "result_b64=$(base64 -w0 result.json)" >> "$GITHUB_OUTPUT"
    outputs:
      result_b64: ${{ steps.result.outputs.result_b64 }}

  record:
    needs: verify
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write        # the only job that writes; it writes only to the `sentinel` branch
    steps:
      - name: Record the result on the sentinel branch
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RESULT_B64: ${{ needs.verify.outputs.result_b64 }}
        run: |
          set -euo pipefail
          test -n "$RESULT_B64" || exit 0
          printf '%s' "$RESULT_B64" | base64 -d > result.json
          python3 -I -c 'import json; json.load(open("result.json"))'     # the result is data; nothing in it is executed
          day=$(date -u +%Y-%m-%d)
          auth="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GITHUB_TOKEN" | base64 -w0)"
          git init -q sentinel-branch
          cd sentinel-branch
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          if git -c http.extraheader="$auth" fetch -q --depth 1 origin sentinel; then
            git checkout -q -b sentinel FETCH_HEAD
          else
            git checkout -q --orphan sentinel
          fi
          mkdir -p results
          name="results/${day}.json"   # 10 Nov (Magnolia 122, EVE-20261110-L524P-01): only the day's first scheduled run writes the day's record
          if [ "${GITHUB_EVENT_NAME:-}" != "schedule" ] || [ "${GITHUB_RUN_ATTEMPT:-1}" != "1" ] || [ -e "$name" ]; then name="results/${day}-${GITHUB_EVENT_NAME:-unknown}-${GITHUB_RUN_ID:-0}-${GITHUB_RUN_ATTEMPT:-1}.json"; fi
          if [ -e "$name" ]; then echo "refusing to overwrite $name"; exit 1; fi   # a results file is written once
          cp ../result.json "$name"
          cp ../result.json latest.json
          status=$(python3 -I -c 'import json; d = json.load(open("latest.json")); s = d.get("status"); print(s if s in ("OK", "DOCS_DRIFT", "FAILED") else ("OK" if d.get("ok") is True else "FAILED"))')
          git add results latest.json
          git commit -q -m "Sentinel ${day}: ${status}"
          git -c http.extraheader="$auth" push -q origin HEAD:sentinel
