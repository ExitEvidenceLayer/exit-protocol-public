# Offline unit tests for this repository.
# Runs the existing local tests and the OpenAPI contract check. No live API, no chain RPC,
# no secrets, and no third-party services. The scheduled evidence-log sentinel is a separate
# workflow and is not repeated here.
name: Offline tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: offline-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.12"]
    steps:
      - name: Check out the repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Run the offline suite
        run: |
          set -euo pipefail
          python -B -m unittest -v \
            test_agent_records \
            test_claims_check \
            test_client_security \
            test_keyless_evidence \
            test_log_verify_trust \
            test_openapi_contract
          python -B -m unittest discover -s control-change -t control-change -p 'test_*.py' -v
