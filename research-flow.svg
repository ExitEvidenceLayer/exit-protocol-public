<rect width="1280" height="440" rx="24" fill="#172822"/>
<rect width="1280" height="440" rx="24" fill="url(#grid)"/>
<g font-family="Arial,Helvetica,sans-serif">
<text x="58" y="65" fill="#d3f272" font-size="15" letter-spacing="3">EXIT / RESEARCH INFRASTRUCTURE</text>
<text x="55" y="134" fill="#f7f6f0" font-size="61" font-weight="700">Follow the evidence.</text>
<text x="58" y="179" fill="#c4d3ca" font-size="24">Control, change and context — with sources you can inspect.</text>
<g fill="#203a2e" stroke="#68846f" stroke-width="1">
<rect x="58" y="238" width="202" height="110" rx="12"/>
