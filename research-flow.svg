<g fill="#f7f6f0" font-size="20" font-weight="700"><text x="78" y="299">Who can do what?</text><text x="318" y="299">Declare the bounds</text><text x="558" y="299">Preserve identity</text><text x="798" y="299">Applied / known</text><text x="1038" y="299">Answer + evidence</text></g>
<g fill="#b9cbbf" font-size="15"><text x="78" y="325">Ask a supported question</text><text x="318" y="325">Subject, network, period</text><text x="558" y="325">Context and provenance</text><text x="798" y="325">Keep both axes visible</text><text x="1038" y="325">Inspect the limits</text></g>
