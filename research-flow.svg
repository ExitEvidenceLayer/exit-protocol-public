<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="440" viewBox="0 0 1280 440" role="img" aria-labelledby="title desc">
<title id="title">EXIT — blockchain research grounded in evidence</title>
<desc id="desc">A conceptual sequence from question and declared scope to identified sources, two kinds of time, and an inspectable answer. It is an architecture illustration, not a performance measurement.</desc>
