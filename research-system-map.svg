<g fill="#19342b"><text x="451" y="217" font-size="11" letter-spacing="1">FIRST SPECIALIZATION</text><text x="451" y="249" font-size="21">Control + change</text><text x="451" y="278" font-size="14">Question → evidence → result</text></g>
<g fill="#142b27" stroke="#b8a181" stroke-dasharray="7 5"><rect x="850" y="65" width="230" height="80"/><rect x="850" y="210" width="230" height="80"/><rect x="850" y="355" width="230" height="80"/><rect x="405" y="390" width="310" height="64"/></g>
<g fill="#eff4ee" font-size="17"><text x="870" y="96">Temporal research graph</text><text x="870" y="241">Inspectable query planning</text><text x="870" y="386">Measured monitoring</text><text x="425" y="416">People · software · organizations</text></g>
