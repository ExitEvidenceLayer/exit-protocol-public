<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 500" role="img" aria-labelledby="maptitle mapdesc">
<title id="maptitle">EXIT research infrastructure: foundation and planned expansion</title>
<desc id="mapdesc">Source identity and time support control and change analysis. Planned extensions connect events and observed flows to research planning, measured monitoring and team workflows. Solid lines show the foundation; dashed lines show planned extensions. This is a conceptual map, not a measurement.</desc>
