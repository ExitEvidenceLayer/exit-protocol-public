<g fill="#f7f6f0" font-size="20" font-weight="700"><text x="70" y="246">Research + operated delivery</text><text x="475" y="246">Official identity published</text><text x="880" y="246">Exact rights + acceptance</text></g>
<g fill="#c5d5ca" font-size="15"><text x="70" y="273">Bounded research with quotas</text><text x="475" y="273">Token ownership is not API credit</text><text x="880" y="273">Payment remains a later release</text></g>
<text x="50" y="350" font-size="15" letter-spacing="1.8" fill="#5f786b">CONDITIONAL WINDOWS AFTER T0 / NOT CALENDAR GUARANTEES</text>
