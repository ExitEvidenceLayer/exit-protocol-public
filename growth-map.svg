<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="620" viewBox="0 0 1280 620" role="img" aria-labelledby="title desc">
<title id="title">EXIT — finite first service and conditional post-launch growth</title>
<desc id="desc">The free service and EXITP exist. Paid integration remains separate. Four conditional quarters after 25 October 2026 expand workflows, temporal research, anomaly methods and organizational integration. This is a conceptual plan, not a completed-delivery claim.</desc>
<rect width="1280" height="620" rx="24" fill="#f7f6f0"/>
<g font-family="Arial,Helvetica,sans-serif" fill="#172822">
<text x="50" y="52" font-size="14" letter-spacing="3" fill="#5f786b">EXIT / DELIVERY AND GROWTH</text>
<text x="50" y="103" font-size="39" font-weight="700">A usable first service. Room to grow.</text>
<text x="50" y="142" font-size="18" fill="#586d61">Later expansion does not postpone the finite first-release boundary.</text>
<g fill="#172822"><rect x="50" y="183" width="370" height="114" rx="12"/><rect x="455" y="183" width="370" height="114" rx="12"/><rect x="860" y="183" width="370" height="114" rx="12"/></g>
